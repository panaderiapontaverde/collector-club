<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collector Club — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F3EFE7; --ink:#211D18; --muted:#736B5E;
    --border:#E6E0D3; --accent:#9C6B33; --accent-ink:#FFFFFF;
    --positive:#3E7856; --negative:#B0402F;
    --shadow: 0 1px 2px rgba(33,29,24,0.04), 0 8px 24px -12px rgba(33,29,24,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140F; --surface:#211D17; --surface-2:#2A2419; --ink:#F1ECE2; --muted:#A79A85;
      --border:#39311F; --accent:#D8A24F; --accent-ink:#1C1305;
      --positive:#6FBF93; --negative:#E1806E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140F; --surface:#211D17; --surface-2:#2A2419; --ink:#F1ECE2; --muted:#A79A85;
    --border:#39311F; --accent:#D8A24F; --accent-ink:#1C1305;
    --positive:#6FBF93; --negative:#E1806E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 64px;}
  @media (min-width:720px){ .wrap{padding:28px 24px 64px;} }

  header.top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .brand-eyebrow{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 4px; }
  h1{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:27px; line-height:1.05; margin:0; letter-spacing:-0.01em; }
  @media (min-width:720px){ h1{font-size:34px;} }
  .meta{ color:var(--muted); font-size:12.5px; line-height:1.5; }

  /* ---- Indicadores ---- */
  .kpis{ display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:18px; }
  @media (min-width:560px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:900px){ .kpis{ grid-template-columns:repeat(3,1fr); } }
  .kpi{ background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:15px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:5px; }
  .kpi.destaque{ border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); }
  @media (min-width:560px){ .kpi.destaque{ grid-column:span 2; } }
  @media (min-width:900px){ .kpi.destaque{ grid-column:span 1; } }
  .kpi .label{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .kpi .value{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:25px;
    letter-spacing:-0.01em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .kpi .value.pos{ color:var(--positive); } .kpi .value.neg{ color:var(--negative); }
  .kpi .sub{ font-size:12px; color:var(--muted); line-height:1.45; }
  .kpi .sub b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .comp{ display:flex; flex-wrap:wrap; gap:3px 10px; font-size:11.5px; color:var(--muted); margin-top:2px; }
  .comp span{ font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* Valor projetado/estimado: nunca deve se confundir com valor registrado. */
  .est{ color:var(--muted); border-bottom:1px dashed currentColor; cursor:help; }
  .tag-est{ display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); border:1px dashed var(--border);
    border-radius:5px; padding:1px 5px; vertical-align:2px; margin-left:5px; }

  /* ---- Abas ---- */
  .tabs{ display:flex; gap:20px; margin:26px 0 14px; border-bottom:1px solid var(--border);
    overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ appearance:none; border:none; background:none; cursor:pointer; font-family:inherit;
    font-size:13.5px; font-weight:600; color:var(--muted); padding:9px 0; white-space:nowrap;
    border-bottom:2px solid transparent; }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .tab-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  .panel{display:none;} .panel.active{display:block;}

  /* ---- Lista de itens: cartões no celular, tabela no desktop ---- */
  .lista{ display:flex; flex-direction:column; gap:8px; }
  .linha{ background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden; }
  .linha > summary, .linha > .cab{ list-style:none; cursor:default; padding:13px 15px;
    display:flex; flex-direction:column; gap:7px; }
  .linha > summary{ cursor:pointer; }
  .linha > summary::-webkit-details-marker{ display:none; }
  .linha .titulo{ font-weight:600; font-size:13.5px; line-height:1.35; display:flex;
    align-items:flex-start; gap:7px; }
  .linha .titulo .seta{ color:var(--muted); font-size:10px; margin-top:4px; transition:transform .15s; }
  .linha[open] .titulo .seta{ transform:rotate(90deg); }
  .campos{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px 14px; font-size:12px; }
  @media (min-width:640px){ .campos{ grid-template-columns:repeat(4,1fr); } }
  .campo{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .campo .k{ font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .campo .v{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .detalhe{ border-top:1px solid var(--border); background:var(--surface-2); padding:12px 15px; }
  .detalhe .campos{ grid-template-columns:repeat(2,1fr); }
  @media (min-width:640px){ .detalhe .campos{ grid-template-columns:repeat(3,1fr); } }
  .detalhe .nota{ font-size:11.5px; color:var(--muted); margin:10px 0 0; line-height:1.5; }

  .pill{ display:inline-block; padding:2px 9px; border-radius:100px; font-size:10.5px; font-weight:600;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--border); white-space:nowrap; }
  .pill.ok{ background:color-mix(in srgb, var(--positive) 16%, transparent); color:var(--positive); border-color:transparent; }
  .pill.pend{ background:color-mix(in srgb, var(--negative) 15%, transparent); color:var(--negative); border-color:transparent; }

  .grupo-tit{ font-family:"Fraunces",serif; font-size:13px; font-weight:600; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); margin:22px 0 10px; }
  .grupo-tit:first-child{ margin-top:0; }
  .resumo-linha{ display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding:11px 15px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); font-size:13.5px; }
  .resumo-linha + .resumo-linha{ margin-top:7px; }
  .resumo-linha .n{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600; }

  .nota-rodape{ font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:14px; }
  footer{ margin-top:34px; color:var(--muted); font-size:11.5px; text-align:center; line-height:1.6; }
  .vazio{ color:var(--muted); font-size:13px; padding:26px 14px; text-align:center;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .stale-banner{ display:none; background:color-mix(in srgb, var(--negative) 14%, transparent);
    color:var(--negative); border:1px solid color-mix(in srgb, var(--negative) 35%, transparent);
    border-radius:10px; padding:10px 14px; font-size:12.5px; margin-bottom:14px; }
  .stale-banner.show{ display:block; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <p class="brand-eyebrow">The Collector Club</p>
      <h1>Painel financeiro</h1>
    </div>
    <div class="meta">atualizado em <span id="updatedAt">—</span></div>
  </header>

  <div class="stale-banner" id="staleBanner">Não consegui buscar os dados mais recentes agora — mostrando a última versão disponível.</div>

  <section class="kpis" id="kpis"></section>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-panel="pEstoque" role="tab">Estoque</button>
    <button class="tab-btn" data-panel="pReceber" role="tab">A receber</button>
    <button class="tab-btn" data-panel="pVendas" role="tab">Vendas</button>
    <button class="tab-btn" data-panel="pContas" role="tab">Empréstimos e despesas</button>
  </nav>

  <div class="panel active" id="pEstoque"></div>
  <div class="panel" id="pReceber"></div>
  <div class="panel" id="pVendas"></div>
  <div class="panel" id="pContas"></div>

  <footer id="footerNote">The Collector Club — dados sincronizados da planilha financeira.</footer>
</div>

<script>
(function(){
  'use strict';

  var BRL = function(v){
    if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
    return new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}).format(v);
  };
  var PCT = function(v){
    if (v === null || v === undefined || isNaN(v) || !isFinite(v)) return '—';
    return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
  };
  var esc = function(s){
    return (s === null || s === undefined ? '' : String(s)).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };
  var num = function(v){ return (v === null || v === undefined || isNaN(v)) ? 0 : v; };
  var norm = function(s){
    return (s === null || s === undefined ? '' : String(s))
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  };
  var foiRealizado = function(c){ return /^s/i.test(String(c.realizado || '')); };

  // Componentes de custo de uma peça, na ordem em que aparecem na planilha.
  var COMPONENTES = [
    {chave:'valorBase',    rotulo:'Preço de compra'},
    {chave:'comissao',     rotulo:'Comissão'},
    {chave:'iof',          rotulo:'IOF'},
    {chave:'frete',        rotulo:'Frete'},
    {chave:'imposto',      rotulo:'Imposto'},
    {chave:'outrosCustos', rotulo:'Outros custos'}
  ];
  // Só estes são projetados quando faltam; o preço de compra sempre existe.
  var ESTIMAVEIS = ['comissao','iof','frete','imposto','outrosCustos'];

  // ------------------------------------------------------------------
  // Cálculo. Tudo deriva das linhas cruas de `estoque` e `caixa`; o painel
  // não depende dos totais pré-calculados da planilha, então uma mudança de
  // fórmula acontece aqui e não exige mexer no n8n.
  // ------------------------------------------------------------------
  function calcular(snap){
    var itens = snap.estoque || [];
    var caixa = snap.caixa || [];

    var vendidos  = itens.filter(function(e){ return !!e.dataVenda; });
    var emEstoque = itens.filter(function(e){ return !e.dataVenda; });

    // Taxa histórica de cada componente, aprendida das peças que já o têm
    // informado. Serve para projetar o que ainda falta lançar, sem percentual
    // cravado no código: conforme a operação registra mais custos, a projeção
    // se ajusta sozinha.
    var taxa = {};
    ESTIMAVEIS.forEach(function(c){
      var informado = 0, base = 0;
      itens.forEach(function(e){
        if (e[c] !== null && e[c] !== undefined){ informado += num(e[c]); base += num(e.valorBase); }
      });
      taxa[c] = base > 0 ? informado / base : 0;
    });

    // Para cada peça: custo registrado (só o que foi lançado), o que ainda é
    // estimativa, e o custo final projetado.
    //
    // A planilha já calcula a projeção nas colunas "Custo final projetado" e
    // "Custos ainda estimados". Quando o snapshot as traz, elas mandam — são a
    // fonte da verdade. A estimativa local existe só para o período em que o
    // snapshot ainda não carrega esses campos, e chega perto sem acertar em
    // cheio, porque a taxa real da planilha é outra.
    var projecaoDaPlanilha = false;
    itens.forEach(function(e){
      var estimadoLocal = 0, faltando = [];
      ESTIMAVEIS.forEach(function(c){
        if (e[c] === null || e[c] === undefined){
          estimadoLocal += num(e.valorBase) * taxa[c];
          faltando.push(c);
        }
      });
      e._registrado = num(e.custoFinal);
      e._faltando   = faltando;

      if (e.custoProjetado !== null && e.custoProjetado !== undefined){
        e._projetado = num(e.custoProjetado);
        e._estimado  = (e.custosEstimados !== null && e.custosEstimados !== undefined)
          ? num(e.custosEstimados) : (e._projetado - e._registrado);
        projecaoDaPlanilha = true;
      } else {
        e._estimado  = estimadoLocal;
        e._projetado = e._registrado + estimadoLocal;
      }
    });

    var realizados = caixa.filter(foiRealizado);
    var pendentes  = caixa.filter(function(c){ return !foiRealizado(c); });

    // Caixa: só o que entrou e o que saiu de fato.
    var entradas = realizados.reduce(function(a,c){ return a + num(c.entrada); }, 0);
    var saidas   = realizados.reduce(function(a,c){ return a + num(c.saida); }, 0);
    var caixaDisponivel = entradas - saidas;

    var porCategoria = function(re, campo){
      return caixa.filter(function(c){ return re.test(c.categoria || ''); })
                  .reduce(function(a,c){ return a + num(c[campo]); }, 0);
    };
    var retiradaSocio  = porCategoria(/retirada/i, 'saida');
    var emprestimoRec  = porCategoria(/empr[ée]stimo/i, 'entrada');
    var emprestimoPago = porCategoria(/empr[ée]stimo/i, 'saida');

    // Vendas a receber: entradas ainda não realizadas. A retirada do sócio é um
    // valor a devolver — some ao patrimônio, mas não é venda; fica à parte.
    var vendasReceber = pendentes.reduce(function(a,c){ return a + num(c.entrada); }, 0);

    var estoqueRegistrado = emEstoque.reduce(function(a,e){ return a + e._registrado; }, 0);
    var estoqueProjetado  = emEstoque.reduce(function(a,e){ return a + e._projetado; }, 0);
    var estoqueEstimado   = estoqueProjetado - estoqueRegistrado;

    var vendasBrutas  = vendidos.reduce(function(a,e){ return a + num(e.valorVenda); }, 0);
    var taxasVenda    = vendidos.reduce(function(a,e){ return a + num(e.taxasVenda); }, 0);
    var vendasLiquido = vendidos.reduce(function(a,e){
      return a + (e.valorLiquido !== null && e.valorLiquido !== undefined
                  ? num(e.valorLiquido) : num(e.valorVenda) - num(e.taxasVenda));
    }, 0);
    var custoVendidas = vendidos.reduce(function(a,e){ return a + e._registrado; }, 0);

    // Despesas operacionais: as que NÃO foram rateadas no custo das peças.
    // Frete e imposto de importação já estão dentro do custo de cada relógio —
    // contá-los aqui de novo seria contar duas vezes a mesma saída de caixa.
    var OPERACIONAIS = /an[uú]ncio|marketing|tr[aá]fego/i;
    var despesasOperacionais = caixa.filter(function(c){
      return OPERACIONAIS.test((c.categoria || '') + ' ' + (c.descricao || ''));
    }).reduce(function(a,c){ return a + num(c.saida); }, 0);

    var lucroPecas = vendidos.reduce(function(a,e){ return a + num(e.lucro); }, 0);
    var lucroAcumulado = lucroPecas - despesasOperacionais;

    // Patrimônio: o que a operação tem. Empréstimos a devolver são obrigação e
    // aparecem à parte, na aba de detalhe — não são abatidos aqui.
    var patrimonio = caixaDisponivel + estoqueRegistrado + vendasReceber + retiradaSocio;

    // Despesas por categoria, para a aba de detalhe.
    var despesas = {};
    caixa.forEach(function(c){
      if (!num(c.saida)) return;
      var k = c.categoria || 'Sem categoria';
      despesas[k] = (despesas[k] || 0) + num(c.saida);
    });

    return {
      itens: itens, vendidos: vendidos, emEstoque: emEstoque,
      pendentes: pendentes, caixa: caixa, taxa: taxa,
      patrimonio: patrimonio,
      caixaDisponivel: caixaDisponivel,
      vendasReceber: vendasReceber,
      retiradaSocio: retiradaSocio,
      estoqueRegistrado: estoqueRegistrado,
      estoqueProjetado: estoqueProjetado,
      estoqueEstimado: estoqueEstimado,
      vendasBrutas: vendasBrutas,
      taxasVenda: taxasVenda,
      vendasLiquido: vendasLiquido,
      custoVendidas: custoVendidas,
      despesasOperacionais: despesasOperacionais,
      lucroAcumulado: lucroAcumulado,
      retornoSobreCusto: custoVendidas > 0 ? lucroAcumulado / custoVendidas * 100 : null,
      margemSobreVendas: vendasLiquido > 0 ? lucroAcumulado / vendasLiquido * 100 : null,
      saldoEmprestimos: emprestimoRec - emprestimoPago,
      despesas: despesas,
      projecaoDaPlanilha: projecaoDaPlanilha,
      semData: caixa.filter(function(c){ return !c.data; }).length
    };
  }

  // ------------------------------------------------------------------
  // Indicadores
  // ------------------------------------------------------------------
  function cartao(rotulo, valor, classe, sub, destaque){
    return '<article class="kpi' + (destaque ? ' destaque' : '') + '">' +
      '<div class="label">' + esc(rotulo) + '</div>' +
      '<div class="value' + (classe ? ' ' + classe : '') + '">' + valor + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') +
      '</article>';
  }

  function renderKPIs(m){
    var h = '';

    h += cartao('Patrimônio', BRL(m.patrimonio), null,
      '<div class="comp">' +
        '<span>caixa <b>' + BRL(m.caixaDisponivel) + '</b></span>' +
        '<span>estoque <b>' + BRL(m.estoqueRegistrado) + '</b></span>' +
        '<span>a receber <b>' + BRL(m.vendasReceber) + '</b></span>' +
        '<span>retiradas <b>' + BRL(m.retiradaSocio) + '</b></span>' +
      '</div>', true);

    h += cartao('Caixa disponível', BRL(m.caixaDisponivel), null,
      'Entradas recebidas menos saídas pagas.');

    h += cartao('Vendas a receber', BRL(m.vendasReceber), null,
      'Pagamentos de clientes ainda pendentes.<br>' +
      'Retirada do sócio a devolver: <b>' + BRL(m.retiradaSocio) + '</b>');

    h += cartao('Estoque pelo custo registrado', BRL(m.estoqueRegistrado), null,
      m.emEstoque.length + (m.emEstoque.length === 1 ? ' peça' : ' peças') + ' · projetado ' +
      '<span class="est" title="Inclui custos ainda não lançados, estimados pela média histórica.">' +
      BRL(m.estoqueProjetado) + '</span>');

    h += cartao('Lucro acumulado das peças vendidas',
      BRL(m.lucroAcumulado), m.lucroAcumulado >= 0 ? 'pos' : 'neg',
      'Valor líquido das vendas menos custo das peças vendidas e despesas operacionais.');

    h += cartao('Retorno sobre o custo das peças vendidas',
      PCT(m.retornoSobreCusto), m.retornoSobreCusto >= 0 ? 'pos' : 'neg',
      'Lucro ÷ custo das peças vendidas.<br>' +
      'Margem sobre vendas: <b>' + PCT(m.margemSobreVendas) + '</b>');

    document.getElementById('kpis').innerHTML = h;
  }

  // ------------------------------------------------------------------
  // Abas de detalhe
  // ------------------------------------------------------------------
  function campo(k, v, classe){
    return '<div class="campo"><div class="k">' + esc(k) + '</div>' +
           '<div class="v' + (classe ? ' ' + classe : '') + '">' + v + '</div></div>';
  }
  function vazio(texto){ return '<p class="vazio">' + esc(texto) + '</p>'; }

  function renderEstoque(m){
    if (!m.emEstoque.length){ return vazio('Nenhuma peça em estoque.'); }
    var h = '<div class="lista">';
    m.emEstoque.forEach(function(e){
      var temEstimativa = e._estimado > 0.005;
      h += '<details class="linha"><summary>' +
        '<div class="titulo"><span class="seta">▶</span><span>' + esc(e.item) + '</span></div>' +
        '<div class="campos">' +
          campo('Custo registrado', BRL(e._registrado)) +
          campo('Custo final projetado',
            temEstimativa
              ? '<span class="est" title="Inclui custos ainda não lançados.">' + BRL(e._projetado) + '</span>'
              : BRL(e._projetado)) +
          campo('Ainda estimado', temEstimativa
              ? '<span class="est">' + BRL(e._estimado) + '</span>'
              : '<span style="color:var(--muted)">—</span>') +
          campo('Origem', esc(e.origem || '—')) +
        '</div></summary>' +
        '<div class="detalhe"><div class="campos">';
      COMPONENTES.forEach(function(c){
        var informado = e[c.chave] !== null && e[c.chave] !== undefined;
        if (informado){
          h += campo(c.rotulo, BRL(e[c.chave]));
        } else {
          var estimativa = num(e.valorBase) * (m.taxa[c.chave] || 0);
          h += campo(c.rotulo,
            '<span class="est" title="Ainda não lançado. Estimado pela média histórica.">' +
            BRL(estimativa) + '</span><span class="tag-est">est.</span>');
        }
      });
      h += '</div>';
      if (temEstimativa){
        h += '<p class="nota">Os valores marcados como <span class="est">estimados</span> ainda não ' +
             'foram lançados na planilha. Projeção não é saída de caixa nem conta a pagar.</p>';
      }
      h += '</div></details>';
    });
    h += '</div>';
    h += '<p class="nota-rodape">Estoque registrado <b>' + BRL(m.estoqueRegistrado) + '</b> · ' +
         'projetado <span class="est">' + BRL(m.estoqueProjetado) + '</span>, dos quais ' +
         '<span class="est">' + BRL(m.estoqueEstimado) + '</span> ainda são estimativas.<br>' +
         (m.projecaoDaPlanilha
            ? 'Projeção calculada pela planilha.'
            : 'A planilha ainda não envia a projeção neste snapshot; os valores acima são ' +
              'estimados pela média histórica dos custos já lançados.') + '</p>';
    return h;
  }

  function renderReceber(m){
    var h = '';
    var vendas = m.pendentes.filter(function(c){ return num(c.entrada) > 0; });

    h += '<div class="grupo-tit">Vendas e parcelas pendentes</div>';
    if (!vendas.length){
      h += vazio('Nada a receber no momento.');
    } else {
      h += '<div class="lista">';
      vendas.forEach(function(c){
        h += '<div class="linha"><div class="cab">' +
          '<div class="titulo"><span>' + esc(c.itemRelacionado || c.descricao) + '</span></div>' +
          '<div class="campos">' +
            campo('Valor', BRL(c.entrada)) +
            campo('Vencimento', esc(c.vencimento || c.data || '—')) +
            campo('Situação', '<span class="pill pend">Pendente</span>') +
            campo('Origem', esc(c.categoria || '—')) +
          '</div></div></div>';
      });
      h += '</div>';
      h += '<p class="nota-rodape">Total a receber de clientes: <b>' + BRL(m.vendasReceber) + '</b></p>';
    }

    h += '<div class="grupo-tit">Retirada do sócio a devolver</div>';
    h += '<div class="resumo-linha"><span>Valor a ser devolvido à operação</span>' +
         '<span class="n">' + BRL(m.retiradaSocio) + '</span></div>';
    h += '<p class="nota-rodape">Listado à parte por não ser venda: entra no patrimônio, ' +
         'mas não compõe o total a receber de clientes.</p>';
    return h;
  }

  function renderVendas(m){
    if (!m.vendidos.length){ return vazio('Nenhuma venda registrada.'); }
    // Uma venda pode ter lucro apurado e pagamento ainda pendente. O caixa é a
    // fonte da verdade sobre o recebimento.
    var pendentesNorm = m.pendentes.map(function(c){
      return norm((c.itemRelacionado || '') + ' ' + (c.descricao || ''));
    });
    var h = '<div class="lista">';
    m.vendidos.forEach(function(e){
      var alvo = norm(e.item);
      var pendente = alvo && pendentesNorm.some(function(p){ return p.indexOf(alvo) !== -1; });
      var liquido = (e.valorLiquido !== null && e.valorLiquido !== undefined)
        ? num(e.valorLiquido) : num(e.valorVenda) - num(e.taxasVenda);
      var retorno = e._registrado > 0 ? num(e.lucro) / e._registrado * 100 : null;
      h += '<div class="linha"><div class="cab">' +
        '<div class="titulo"><span>' + esc(e.item) + '</span></div>' +
        '<div class="campos">' +
          campo('Valor da venda', BRL(e.valorVenda)) +
          campo('Custo da peça', BRL(e._registrado)) +
          campo('Taxas', BRL(num(e.taxasVenda))) +
          campo('Lucro', BRL(e.lucro), num(e.lucro) >= 0 ? '' : '') +
          campo('Retorno sobre custo', PCT(retorno)) +
          campo('Valor líquido', BRL(liquido)) +
          campo('Canal', esc(e.canalVenda || '—')) +
          campo('Recebimento', pendente
            ? '<span class="pill pend">Pendente</span>'
            : '<span class="pill ok">Recebido</span>') +
        '</div></div></div>';
    });
    h += '</div>';
    h += '<p class="nota-rodape">' + m.vendidos.length + ' peças vendidas · ' +
      BRL(m.vendasBrutas) + ' em vendas registradas · custo ' + BRL(m.custoVendidas) +
      ' · lucro ' + BRL(m.lucroAcumulado) + ' já descontadas as despesas operacionais.<br>' +
      'Venda com pagamento pendente tem lucro apurado, mas não aumenta o caixa.</p>';
    return h;
  }

  function renderContas(m){
    var h = '';
    h += '<div class="grupo-tit">Empréstimos a devolver ao sócio</div>';
    h += '<div class="resumo-linha"><span>Saldo devedor</span>' +
         '<span class="n">' + BRL(m.saldoEmprestimos) + '</span></div>';
    h += '<p class="nota-rodape">Aportes e empréstimos não são receita nem lucro. ' +
         'O saldo é obrigação da operação e não foi abatido do patrimônio na tela inicial.</p>';

    h += '<div class="grupo-tit">Despesas por categoria</div>';
    var cats = Object.keys(m.despesas).sort(function(a,b){ return m.despesas[b] - m.despesas[a]; });
    if (!cats.length){
      h += vazio('Nenhuma despesa registrada.');
    } else {
      cats.forEach(function(k){
        h += '<div class="resumo-linha"><span>' + esc(k) + '</span>' +
             '<span class="n">' + BRL(m.despesas[k]) + '</span></div>';
      });
      h += '<p class="nota-rodape">Despesas operacionais consideradas no lucro: <b>' +
        BRL(m.despesasOperacionais) + '</b> (anúncios e marketing).<br>' +
        'Compras, fretes e impostos de importação aparecem acima como saída de caixa, mas ' +
        'já estão rateados no custo de cada relógio — por isso não são descontados de novo do lucro.</p>';
    }
    return h;
  }

  // ------------------------------------------------------------------
  function wireTabs(){
    var btns = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        btns.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        Array.prototype.slice.call(document.querySelectorAll('.panel')).forEach(function(p){
          p.classList.toggle('active', p.id === btn.getAttribute('data-panel'));
        });
      });
    });
  }

  function renderAll(snap){
    var m = calcular(snap);
    renderKPIs(m);
    document.getElementById('pEstoque').innerHTML = renderEstoque(m);
    document.getElementById('pReceber').innerHTML = renderReceber(m);
    document.getElementById('pVendas').innerHTML  = renderVendas(m);
    document.getElementById('pContas').innerHTML  = renderContas(m);

    var quando = '—';
    if (snap.updatedAt){
      var d = new Date(snap.updatedAt);
      if (!isNaN(d)) quando = d.toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
    }
    document.getElementById('updatedAt').textContent = quando;

    var nota = 'The Collector Club — dados sincronizados da planilha financeira.';
    if (m.semData){
      nota += '<br>' + m.semData + ' lançamento' + (m.semData === 1 ? '' : 's') +
        ' sem data; qualquer recorte por mês considera apenas os que têm data confiável.';
    }
    document.getElementById('footerNote').innerHTML = nota;
  }

  function renderEmptyState(){
    document.getElementById('updatedAt').textContent = '—';
    document.getElementById('kpis').innerHTML = '';
    document.getElementById('pEstoque').innerHTML = vazio('Ainda sem dados sincronizados.');
    document.getElementById('footerNote').textContent =
      'Ainda sem dados sincronizados. A primeira atualização deve chegar em breve.';
  }

  wireTabs();

  var DATA_URL = 'https://raw.githubusercontent.com/panaderiapontaverde/collector-club/main/data/snapshot.json';
  var CACHE_KEY = 'collector-club-snapshot-cache-v3';

  function readCache(){
    try { var raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function writeCache(snap){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(snap)); } catch (e) {}
  }

  function loadSnapshot(){
    var banner = document.getElementById('staleBanner');
    fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'})
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(snap){
        writeCache(snap);
        banner.classList.remove('show');
        renderAll(snap);
      })
      .catch(function(){
        var cached = readCache();
        if (cached){ banner.classList.add('show'); renderAll(cached); }
        else { renderEmptyState(); }
      });
  }

  loadSnapshot();
  setInterval(loadSnapshot, 5 * 60 * 1000);
})();
</script>
</body>
</html>
